<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改常见属性</title>
  <style>
    img {
      height: 500px;
      width: 500px;
    }
  </style>
</head>

<body>
  <img src="./images/1.webp" alt="">
  <script>
    // 获取对象属性
    const img = document.querySelector('img')
    // 修改属性   对象.属性 = 值
    img.src = './images/2.webp'
    // img.title = '明月夜'
  </script>
</body>

</html>
