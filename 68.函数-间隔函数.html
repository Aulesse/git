  <script>
    // 间隔函数 interv(函数，间隔时间)
    // setInterval(function () {
    //   console.log('一秒一次')
    // }, 1000)

    function fn() {
      console.log('一秒')
    }

    let n = setInterval(fn, 1000)
    // setInterval(函数名，间隔时间) 函数名不需要加小括号
    // setInterval('fn()', 1000)
    console.log(n)

    // 关闭定时器
    clearInterval(n)
