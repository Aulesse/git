<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>学生信息管理</title>
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <h1>新增学员</h1>
  <form class="info" autocomplete="off">
    姓名：<input type="text" class="uname" name="uname" />
    年龄：<input type="text" class="age" name="age" />
    性别:
    <select name="gender" class="gender">
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
    薪资：<input type="text" class="salary" name="salary" />
    就业城市：<select name="city" class="city">
      <option value="北京">北京</option>
      <option value="上海">上海</option>
      <option value="广州">广州</option>
      <option value="深圳">深圳</option>
      <option value="曹县">曹县</option>
    </select>
    <button class="add">录入</button>
  </form>

  <h1>就业榜</h1>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>薪资</th>
        <th>就业城市</th>
        <th>录入时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!-- 
        <tr>
          <td>1001</td>
          <td>欧阳霸天</td>
          <td>19</td>
          <td>男</td>
          <td>15000</td>
          <td>上海</td>
          <td>
            <a href="javascript:">删除</a>
          </td>
        </tr> 
        -->
    </tbody>
  </table>
  <script>
    // 参考数据
    const initData = [
      {
        stuId: 1,
        uname: '欧阳霸天',
        age: 19,
        gender: '男',
        salary: '20000',
        city: '上海',
        time: '2099/9/9 08:08:08'
      }
    ]

    // localStorage.setItem('data', JSON.stringify(initData))
    // 1.渲染业务
    // 1.1 先读取本地存储的数据
    // (1) 本地存储有数据记得转换为对象然后存储到变量里面 后期用于渲染页面
    // (2) 如果没有数据则用空数组代替
    const arr = JSON.parse(localStorage.getItem('data')) || []
    console.log(arr)

    // 1.2 利用map 和 join 方法来渲染页面
    const tbody = document.querySelector('tbody')
    function render() {
      // 1.21 利用map遍历数组 返回对应的tr的数组
      const trArr = arr.map(function (ele, index) {
        return `
            <tr>
              <td>${ele.stuId}</td>
              <td>${ele.uname}</td>
              <td>${ele.age}</td>
              <td>${ele.gender}</td>
              <td>${ele.salary}</td>
              <td>${ele.city}</td>
              <td>${ele.time}</td>
              <td>
                <a href="javascript:" data-id = "${index}">删除</a>
              </td>
            </tr> 
        `
      })

      console.log(trArr)
      // 1.22 把数组转换为字符串 join
      // 1.23 把生成的字符串追加给tbody
      tbody.innerHTML = trArr.join('')
      // 显示共计几条数据
      // document.querySelector('.title span').innerHTML = arr.length
    }

    render()

    // 2.新增业务
    const info = document.querySelector('.info')
    const uname = document.querySelector('.uname')
    const age = document.querySelector('.age')
    const salary = document.querySelector('.salary')
    const gender = document.querySelector('.gender')
    const city = document.querySelector('.city')

    // 2.1 form表单注册提交事件，默认阻止行为
    info.addEventListener('submit', function (e) {
      e.preventDefault()
      // 2.2 非空判断
      if (!uname.value || !age.value || !salary.value) {
        return alert('输入内容不能为空')
      }

      // 2.3 给arr 数组追加对象 里面存储 表单获过来的数据
      arr.push({
        stuId: arr.length ? arr[arr.length - 1].stuId + 1 : 1,
        uname: uname.value,
        age: age.value,
        gender: gender.value,
        salary: salary.value,
        city: city.value,
        time: new Date().toLocaleString()
      })
      // 2.4 渲染页面和重置表单
      render()
      this.reset() //重置表单

      // 2.5 把数组重新存入本地存储里 记得转换成JSON字符串存储
      localStorage.setItem('data', JSON.stringify(arr))
    })

    // 3.删除业务
    // 3.1 采用事件委托形式 给tbody 注册点击事件
    tbody.addEventListener('click', function (e) {
      // 判断是否点击的是删除按钮 A 链接
      if (e.target.tagName === 'A') {
        // alert(11)
        // 3.2 得到当前点击链接的索引号 渲染数据的时候 动态给a链接添加自定义属性例如 data-id = '0'
        console.log(e.target.dataset.id)

        // 确认框确认是否真的要删除
        if (confirm('您真的要删除这条数据吗?')) {
          // 3.3 根据索引号 利用splice 删除数组这条数据
          arr.splice(e.target.dataset.id, 1)
          // 3.4 重新渲染
          render()
          // 3.5 把最新 arr 数组存入本地存储
          localStorage.setItem('data', JSON.stringify(arr))
        }
      }
    })
  </script>
</body>

</html>
