<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通过类名修改样式</title>
  <style>
    div {
      width: 200px;
      height: 200px;
      background-color: pink;
    }

    .nav {
      color: red;
    }

    .box {
      width: 300px;
      height: 300px;
      background-color: skyblue;
      margin: 100px auto;
      padding: 10px;
      border: 1px solid #000;
    }
  </style>
</head>

<body>
  <div class="nav">132</div>
  <script>
    // 1.获取元素
    const div = document.querySelector('div')
    // 2.添加类名 class 是个关键字 我们用className
    div.className = 'box nav'
    // 3.className 会覆盖掉前面的类名，所以只会有一个class，但是class和className 都想保留那就在className中把class的类名加进去

    // 用className 比 style 要方便简洁
  </script>
</body>

</html>
