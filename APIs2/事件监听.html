<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>点击事件</title>
</head>

<body>
  <!-- 
  事件源：点击按钮
  事件类型：click
  事件调用函数：alert
  -->
  <button>点我</button>
  <script>
    // 获取元素
    const btn = document.querySelector('button')

    // 事件监听
    btn.addEventListener('click', function () {
      alert('(｡•ω•｡)ﾉ♡ 喵~')
    })
  </script>
</body>

</html>
